<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .fade-in {
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .bounce {
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">Emotion Detection</h1>
    <form id="upload-form" class="mb-6">
        <div class="mb-4">
            <label for="file-upload" class="block text-sm font-medium text-gray-700 mb-2">Upload an image</label>
            <input type="file" id="file-upload" name="file" accept="image/*" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-200">
            Detect Emotion
        </button>
    </form>
    <div id="result" class="text-center hidden fade-in">
        <h2 class="text-2xl font-semibold mb-2">Detected Emotion:</h2>
        <p id="emotion" class="text-4xl font-bold text-blue-600"></p>
    </div>
    <div id="loading" class="text-center hidden">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900"></div>
        <p class="mt-2 text-gray-600">Detecting emotion...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
<script>
    const form = document.getElementById('upload-form');
    const result = document.getElementById('result');
    const emotion = document.getElementById('emotion');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);

        result.classList.add('hidden');
        loading.classList.remove('hidden');

        try {
            const response = await axios.post('/predict', formData, {
                headers: { 'Content-Type': 'multipart/form-data' }
            });
            emotion.textContent = response.data.emotion;
            result.classList.remove('hidden');
        } catch (error) {
            console.error('Error:', error);
            emotion.textContent = 'Error detecting emotion';
            result.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
        }
    });
</script>
</body>
</html>
